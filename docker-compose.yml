name: mtgvrc
services:
  database:
    image: postgres:15
    container_name: mtgvrc_database
    restart: always
    environment:
      POSTGRES_USER: mtgvrc
      POSTGRES_PASSWORD: 4fhTE1P2jWpriqu3ZyGO
      POSTGRES_DB: mtgvrc
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    ports:
      - "55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - default

  server:
    image: node:latest
    working_dir: /app
    container_name: mtgvrc_server
    restart: always
    volumes:
      - .:/app
    # ports:
    #   - "55433:3000"
    environment:
      DATABASE_URL: postgres://mtgvrc:4fhTE1P2jWpriqu3ZyGO@mtgvrc_database:5432/mtgvrc
      TZ: Europe/Paris
      # TEMPORAIRE : relance le sweep Moxfield tant qu'il n'a pas fini toute
      # la liste des cartes. Mettre "0" une fois le balayage terminé.
      MOXFIELD_AUTO_SWEEP: "1"
    depends_on:
      - database
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    networks:
      - default
      - nginx

volumes:
  database:

networks:
  nginx:
    name: nginx
    external: true
  default:
    name: mtgvrc